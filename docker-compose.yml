services:
  app:
    image: prchecks:latest
    container_name: prvalidation
    tty: true
    stdin_open: true
    environment:
      GAS_WEB_APP_URL: ${GAS_WEB_APP_URL}
      GAS_API_KEY: ${GAS_API_KEY}
    volumes:
      - ./src:/var/www/app/src
      - ./composer.json:/var/www/app/composer.json
      - ./phpstan:/var/www/app/phpstan
      - ./phpstan.neon:/var/www/app/phpstan.neon
      - ./scripts:/var/www/app/scripts
      - ./logs:/var/logs
      - /Users/vsavakhande/.config/gcloud:/root/.config/gcloud
    secrets:
      - google-service-account
secrets:
  google-service-account:
    file: ./scripts/config/google-service-account.json
